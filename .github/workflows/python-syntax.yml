name: Python syntax check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compile Python sources
        run: |
          python -m py_compile \
            src/follow_drone.py \
            src/hailo_person_detector.py \
            tests/hardware/takeoff_hover_land_test.py
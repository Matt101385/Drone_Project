name: Python syntax check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compile tracked Python files
        run: |
          git ls-files -z -- '*.py' | xargs -0 -r python -m py_compile
